[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc-designation"
version = "1.1.0"
description = "Convert between packed and unpacked MPC (Minor Planet Center) designations"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.9"
authors = [
    { name = "Rob Seaman", email = "rseaman@arizona.edu" },
]
maintainers = [
    { name = "Rob Seaman", email = "rseaman@arizona.edu" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = ["astronomy", "minor planet", "asteroid", "comet", "MPC"]

[project.urls]
Homepage = "https://github.com/rlseaman/MPC_designations"
Documentation = "https://github.com/rlseaman/MPC_designations#readme"
Repository = "https://github.com/rlseaman/MPC_designations.git"
Changelog = "https://github.com/rlseaman/MPC_designations/blob/main/CHANGELOG.md"
Issues = "https://github.com/rlseaman/MPC_designations/issues"

[project.scripts]
mpc-designation = "mpc_designation.mpc_designation:main"

[tool.setuptools.packages.find]
where = ["src"]
